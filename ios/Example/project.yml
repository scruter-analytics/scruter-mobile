# The example apps of the iOS SDK: on iOS, SwiftUI and UIKit screens, a list, a form and a masked view; on a native Mac
# (ScruterExampleMac), a SwiftUI window, an AppKit window and an event (ios/scripts/macos-run.sh runs it).
# Generate the Xcode project with XcodeGen (https://github.com/yonaskolb/XcodeGen): `xcodegen` in this directory.
# The SDK's sources are compiled here as one framework module (as CocoaPods builds the pod); apps integrate it through
# Swift Package Manager or CocoaPods (../README.md).
name: ScruterExample
options:
  bundleIdPrefix: net.scruter
  deploymentTarget:
    iOS: "15.0"
    macOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ScruterAnalytics:
    type: framework
    platform: iOS
    sources:
      - path: ../Sources/ScruterAnalytics
      - path: ../Sources/ScruterCrash
        headerVisibility: public
      - path: Support/ScruterAnalytics.h
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.scruter.analytics
        PRODUCT_NAME: ScruterAnalytics
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: NO
        CLANG_ENABLE_MODULES: YES
        # Optimised in every configuration, tests included: they measure the budgets of docs/MOBILE.md §3.18.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_COMPILATION_MODE: wholemodule
        GCC_OPTIMIZATION_LEVEL: s
  ScruterExample:
    type: application
    platform: iOS
    sources:
      - path: ScruterExample
    dependencies:
      - target: ScruterAnalytics
    info:
      path: ScruterExample/Info.plist
      properties:
        CFBundleDisplayName: Scruter Example
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "100"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: net.scruter.example.team
            CFBundleURLSchemes: [scruter-exmpl01]
        NSAdvertisingAttributionReportEndpoint: https://scruter.net
        AdAttributionKit:
          AttributionCopyEndpoint: https://scruter.net
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.scruter.example
        TARGETED_DEVICE_FAMILY: "1,2"
  ScruterExampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScruterExampleTests
    dependencies:
      - target: ScruterExample
      - target: ScruterAnalytics
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.scruter.example.tests
        GENERATE_INFOPLIST_FILE: YES
  ScruterAnalyticsMac:
    type: framework
    platform: macOS
    sources:
      - path: ../Sources/ScruterAnalytics
      - path: ../Sources/ScruterCrash
        headerVisibility: public
      - path: Support/ScruterAnalytics.h
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.scruter.analytics.mac
        PRODUCT_NAME: ScruterAnalytics
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CLANG_ENABLE_MODULES: YES
        MACOSX_DEPLOYMENT_TARGET: "12.0"
  ScruterExampleMac:
    type: application
    platform: macOS
    sources:
      - path: ScruterExampleMac
    dependencies:
      - target: ScruterAnalyticsMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.scruter.example.mac
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scruter Example
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "100"
        # Signed to run locally: a Debug build carries get-task-allow, the SDK sees a debug build.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  ScruterExample:
    build:
      targets:
        ScruterExample: all
        ScruterExampleTests: [test]
    test:
      config: Debug
      targets: [ScruterExampleTests]
      gatherCoverageData: false
  ScruterExampleMac:
    build:
      targets:
        ScruterExampleMac: all
