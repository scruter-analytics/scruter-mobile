// The Android half of @scruter/react-native. Java only: an app's Kotlin version never matters here.
// The React plugin runs the codegen of src/specs on both architectures: one module class, the generated spec's.
apply plugin: 'com.android.library'
apply plugin: 'com.facebook.react'

def safeExt(String name, Object fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

/**
 * The modules the app takes (docs/CMP-MOBILE.md §3.16, M2): its package.json's "scruter" key, read here and by
 * ScruterReactNative.podspec. Scruter Analytics unless "analytics": false; Scruter CMP with "cmp": true. An app carries
 * only the native code of what it takes.
 */
def scruterModules() {
  def app = new File(rootProject.projectDir, '../package.json')
  def config = app.exists() ? (new groovy.json.JsonSlurper().parse(app).scruter ?: [:]) : [:]
  def modules = [analytics: config.analytics != false, cmp: config.cmp == true]
  if (!modules.analytics && !modules.cmp) {
    throw new GradleException('[Scruter] "scruter": { "analytics": false } without "cmp": true leaves nothing to install')
  }
  return modules
}

def modules = scruterModules()

def reactNativeMinor() {
  def file = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim())
  def version = new groovy.json.JsonSlurper().parse(file).version
  return version.tokenize('.')[1] as int
}

android {
  namespace 'net.scruter.reactnative'
  compileSdk safeExt('compileSdkVersion', 35)

  defaultConfig {
    minSdk Math.max(safeExt('minSdkVersion', 24) as int, 24)
    targetSdk safeExt('targetSdkVersion', 35)
    consumerProguardFiles 'proguard-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      // BaseReactPackage came in 0.74; TurboReactPackage is what 0.73 has, deprecated since.
      java.srcDirs += [reactNativeMinor() >= 74 ? 'src/rn74/java' : 'src/rn73/java']
      java.srcDirs += [modules.analytics ? 'src/analytics/java' : 'src/analytics-off/java']
      java.srcDirs += [modules.cmp ? 'src/cmp/java' : 'src/cmp-off/java']
    }
  }

  lint {
    abortOnError false
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // implementation: the app's own compiler, which can be older than the SDK's, never reads the SDK's Kotlin metadata.
  if (modules.analytics) implementation 'net.scruter:scruter-android:1.2.0'
  if (modules.cmp) implementation 'net.scruter:scruter-cmp:1.2.0'
  testImplementation 'junit:junit:4.13.2'
}
