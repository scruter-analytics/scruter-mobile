# A JavaScript reload: the native module keeps running, the new context hears each change once.
appId: net.scruter.rnexample
---
- scrollUntilVisible:
    element:
      id: "cmp_reload"
    direction: DOWN
- tapOn:
    id: "cmp_reload"
- extendedWaitUntil:
    visible:
      id: "open_privacy"
    timeout: 60000
- tapOn:
    id: "open_privacy"
- extendedWaitUntil:
    visible:
      id: "cmp_calls"
      text: "1 · 0"
    timeout: 20000
- assertNotVisible: "Accept all"
- scrollUntilVisible:
    element:
      id: "privacy_choices"
    direction: DOWN
- tapOn:
    id: "privacy_choices"
- extendedWaitUntil:
    visible: "Accept all"
    timeout: 20000
- tapOn: "Accept all"
- scrollUntilVisible:
    element:
      id: "cmp_calls"
    direction: UP
- extendedWaitUntil:
    visible:
      id: "cmp_calls"
      text: "1 · 1"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "cmp_calls"
    text: "1 · 1"
