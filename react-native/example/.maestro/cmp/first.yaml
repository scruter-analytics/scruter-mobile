# Scruter CMP, first launch (../../../scripts/cmp-device-check.mjs): the native sheet over the app, the decision,
# whenReady in JavaScript, the stand-ins gated on it, then the settings entry and a withdrawal.
appId: net.scruter.rnexample
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Accept all"
    timeout: 180000
- takeScreenshot: rn-sheet
- tapOn: "Accept all"
# Apple's tracking prompt, asked after the CMP because advertising is granted.
- tapOn:
    text: "Ask App Not to Track"
    optional: true
- extendedWaitUntil:
    visible:
      id: "open_privacy"
    timeout: 20000
- tapOn:
    id: "open_privacy"
- extendedWaitUntil:
    visible:
      id: "cmp_state"
      text: "ready"
    timeout: 20000
- assertVisible:
    id: "cmp_calls"
    text: "1 · 0"
- assertVisible:
    id: "partner_analytics"
    text: "started"
- assertVisible:
    id: "partner_ads"
    text: "personalised"
- assertVisible:
    id: "partner_gcm"
    text: "granted"
- takeScreenshot: rn-privacy
- scrollUntilVisible:
    element:
      id: "privacy_choices"
    direction: DOWN
- tapOn:
    id: "privacy_choices"
- extendedWaitUntil:
    visible: "Reject all"
    timeout: 20000
- takeScreenshot: rn-preferences
- tapOn: "Reject all"
- scrollUntilVisible:
    element:
      id: "cmp_calls"
    direction: UP
- extendedWaitUntil:
    visible:
      id: "cmp_calls"
      text: "1 · 1"
    timeout: 20000
- assertVisible:
    id: "partner_analytics"
    text: "off"
- assertVisible:
    id: "partner_ads"
    text: "non-personalised"
