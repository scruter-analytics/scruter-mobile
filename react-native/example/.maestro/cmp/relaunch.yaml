# A returning visitor: no sheet, whenReady at once; then the debug reset asks again, and that decision is a change.
appId: net.scruter.rnexample
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "open_privacy"
    timeout: 60000
- tapOn:
    id: "open_privacy"
- extendedWaitUntil:
    visible:
      id: "cmp_calls"
      text: "1 · 0"
    timeout: 20000
- assertVisible:
    id: "cmp_state"
    text: "ready"
- assertNotVisible: "Accept all"
- scrollUntilVisible:
    element:
      id: "cmp_reset"
    direction: DOWN
- tapOn:
    id: "cmp_reset"
- extendedWaitUntil:
    visible: "Reject all"
    timeout: 20000
- tapOn: "Reject all"
- scrollUntilVisible:
    element:
      id: "cmp_calls"
    direction: UP
- extendedWaitUntil:
    visible:
      id: "cmp_calls"
      text: "1 · 1"
    timeout: 20000
- assertVisible:
    id: "partner_analytics"
    text: "off"
