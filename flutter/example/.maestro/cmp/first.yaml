# Scruter CMP, first launch (../../../scripts/cmp-device-check.mjs, the app started by `flutter run`): the native sheet
# over Flutter's navigator, the decision, whenReady in Dart, the stand-ins gated on it, the settings entry, a withdrawal.
# Flutter merges a row's texts into one label ("State\nready"): the patterns take both forms.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: "Accept all"
    timeout: 90000
- takeScreenshot: flutter-sheet
- tapOn: "Accept all"
- tapOn:
    text: "Ask App Not to Track"
    optional: true
- extendedWaitUntil:
    visible: "Privacy"
    timeout: 20000
- tapOn: "Privacy"
- extendedWaitUntil:
    visible: "(State\n)?ready"
    timeout: 20000
- assertVisible: "(whenReady · onChange\n)?1 · 0"
- assertVisible: "(Analytics SDK\n)?started"
- assertVisible: "(Ads\n)?personalised"
- assertVisible: "(analytics_storage\n)?granted"
- takeScreenshot: flutter-privacy
- scrollUntilVisible:
    element: "Privacy choices"
    direction: DOWN
- tapOn: "Privacy choices"
- extendedWaitUntil:
    visible: "Reject all"
    timeout: 20000
- takeScreenshot: flutter-preferences
- tapOn: "Reject all"
- scrollUntilVisible:
    element: "whenReady · onChange(\n.*)?"
    direction: UP
- extendedWaitUntil:
    visible: "(whenReady · onChange\n)?1 · 1"
    timeout: 20000
- assertVisible: "(Ads\n)?non-personalised"
