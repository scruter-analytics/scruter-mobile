# A returning visitor: no sheet, whenReady at once; then the debug reset asks again, and that decision is a change.
appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible: "Privacy"
    timeout: 60000
- tapOn: "Privacy"
- extendedWaitUntil:
    visible: "(whenReady · onChange\n)?1 · 0"
    timeout: 20000
- assertVisible: "(State\n)?ready"
- assertNotVisible: "Accept all"
- scrollUntilVisible:
    element: "Reset the choice (debug)"
    direction: DOWN
- tapOn: "Reset the choice (debug)"
- extendedWaitUntil:
    visible: "Reject all"
    timeout: 20000
- tapOn: "Reject all"
- scrollUntilVisible:
    element: "whenReady · onChange(\n.*)?"
    direction: UP
- extendedWaitUntil:
    visible: "(whenReady · onChange\n)?1 · 1"
    timeout: 20000
- assertVisible: "(Analytics SDK\n)?off"
