# Scruter CMP for iOS (ScruterCMP): the module's tests on the kit (macOS host) and the bodies it sends against the
# protocol's schemas, the size budget, the sheet built for iOS, the snapshot tests on an iPhone and an iPad, the example
# apps' UI tests and accessibility audits against a local ingest, `pod lib lint`.
name: ios-cmp

on:
  push:
    branches: ["main", "wip/**"]
    paths: ["ios/Sources/ScruterCMP/**", "ios/Tests/ScruterCMPTests/**", "ios/ExampleCMP/**", "ios/scripts/cmp*",
            "ios/CMP.md", "Package.swift", "ScruterCMP.podspec", "protocol/**", ".github/workflows/ios-cmp.yml"]
  pull_request:
    paths: ["ios/Sources/ScruterCMP/**", "ios/Tests/ScruterCMPTests/**", "ios/ExampleCMP/**", "ios/scripts/cmp*",
            "ios/CMP.md", "Package.swift", "ScruterCMP.podspec", "protocol/**", ".github/workflows/ios-cmp.yml"]
  workflow_dispatch:
    inputs:
      record:
        description: "Record the snapshot references instead of comparing"
        type: boolean
        default: false
  workflow_call:

concurrency:
  group: ios-cmp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  XCODEGEN_VERSION: "2.42.0"
  XCODEGEN_SHA256: "1b677f04a4239e90c5b4a1b2ed0d5eefaf5afab2f012af6dacef6d4d3a53ccba"

jobs:
  ios-cmp:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          node --version

      - name: The kit and the embedded words
        run: |
          node protocol/cmp/check.mjs
          node ios/scripts/cmp-words.mjs --check

      - name: Module tests (macOS host) and the bodies against the schemas
        run: |
          rm -rf .build/cmp-bodies
          SCRUTER_CMP_BODIES="$PWD/.build/cmp-bodies" swift test --filter ScruterCMPTests -j 3
          ios/scripts/cmp-conformance.sh

      - name: The module for iOS (Swift Package Manager)
        run: xcodebuild build -scheme ScruterCMP -destination "generic/platform=iOS Simulator" -skipPackagePluginValidation -quiet

      - name: Simulators
        id: sim
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          prefix = sys.argv[1]
          d = json.load(sys.stdin)["devices"]
          best = None
          for rt, devs in d.items():
              if "iOS" not in rt: continue
              for x in devs:
                  if x["name"].startswith(prefix) and (best is None or rt > best[0] or (rt == best[0] and x["name"] < best[1])):
                      best = (rt, x["name"], x["udid"])
          print(best[2])' "$1"
          }
          phone=$(pick "iPhone 16")
          pad=$(pick "iPad")
          echo "phone=$phone" >> "$GITHUB_OUTPUT"
          echo "pad=$pad" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$phone" || true
          xcrun simctl boot "$pad" || true

      - name: Example apps
        run: |
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.artifactbundle.zip"
          echo "$XCODEGEN_SHA256  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          gen=$(find /tmp/xcodegen -type f -name xcodegen -perm -u+x | head -1)
          (cd ios/ExampleCMP && "$gen" generate --quiet)

      - name: Snapshots, UI tests and accessibility audits (iPhone)
        run: |
          python3 ios/scripts/cmp_stub_ingest.py 8765 "$PWD/.build/cmp-stub" &
          echo $! > /tmp/stub.pid
          record=${{ inputs.record && '1' || '0' }}
          TEST_RUNNER_SCRUTER_SNAPSHOT_OUT="$PWD/.build/cmp-out/snapshots" TEST_RUNNER_SCRUTER_SNAPSHOT_RECORD=$record \
            xcodebuild test -project ios/ExampleCMP/ScruterCMPExample.xcodeproj -scheme CMPExample \
            -destination "id=${{ steps.sim.outputs.phone }}" -resultBundlePath .build/cmp-out/phone.xcresult \
            > /tmp/phone.log 2>&1 || status=$?
          grep -E 'error:|\*\* TEST|\[a11y\]|Executed .* tests|failed' /tmp/phone.log | tail -80
          [ "${status:-0}" = 0 ]

      - name: UIKit example (manual presentation)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        run: |
          xcodebuild test -project ios/ExampleCMP/ScruterCMPExample.xcodeproj -scheme CMPExampleUIKit \
            -destination "id=${{ steps.sim.outputs.phone }}" > /tmp/uikit.log 2>&1 || status=$?
          grep -E 'error:|\*\* TEST|Executed .* tests|failed' /tmp/uikit.log | tail -40
          [ "${status:-0}" = 0 ]

      - name: Snapshots (iPad)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        run: |
          record=${{ inputs.record && '1' || '0' }}
          TEST_RUNNER_SCRUTER_SNAPSHOT_OUT="$PWD/.build/cmp-out/snapshots" TEST_RUNNER_SCRUTER_SNAPSHOT_RECORD=$record \
            xcodebuild test -project ios/ExampleCMP/ScruterCMPExample.xcodeproj -scheme CMPSnapshots \
            -destination "id=${{ steps.sim.outputs.pad }}" > /tmp/pad.log 2>&1 || status=$?
          grep -E 'error:|\*\* TEST|Executed .* tests|failed' /tmp/pad.log | tail -40
          [ "${status:-0}" = 0 ]

      - name: The bodies the example apps sent, against the schemas
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        run: |
          kill "$(cat /tmp/stub.pid)" || true
          SCRUTER_CMP_BODIES="$PWD/.build/cmp-stub" ios/scripts/cmp-conformance.sh

      - name: pod lib lint
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        run: pod lib lint ScruterCMP.podspec --platforms=ios --skip-tests --allow-warnings --fail-fast

      # Last, so that a budget overrun never hides what the tests found.
      - name: Binary size (what the module adds to an app)
        if: ${{ !cancelled() }}
        run: SCRUTER_SIZE_DETAIL="$PWD/.build/cmp-out" ios/scripts/cmp-size.sh

      - name: Snapshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmp-out
          path: |
            ios/ExampleCMP/Snapshots
            .build/cmp-out
            .build/cmp-bodies
            .build/cmp-stub
          if-no-files-found: ignore
          retention-days: 7
