name: Android CMP

# Scruter CMP for Android apps (docs/CMP-MOBILE.md): the module and its Compose companion, the sheet's screenshot tests,
# the beacons against the protocol kit, the size budget, the example app with Espresso's accessibility checks on an
# emulator, and the detected-SDK catalogue against each SDK's current release.
on:
  push:
    paths: ["android/**", "protocol/**", ".github/workflows/android-cmp.yml"]
  pull_request:
    paths: ["android/**", "protocol/**", ".github/workflows/android-cmp.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  cmp:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
      - name: The catalogue's consumer rules
        run: python3 scripts/check-sdk-catalogue.py sync
      - name: The protocol kit
        run: node ../protocol/cmp/check.mjs
      - name: Unit, flow and screenshot tests (Robolectric), lint
        run: ./gradlew --no-daemon --max-workers=3 :scruter-cmp:testDebugUnitTest :scruter-cmp:lintDebug :scruter-cmp-compose:lintDebug :sample-cmp:lintDebug
      - name: Beacons against the protocol schemas
        run: scripts/conformance.sh
      - name: R8 builds and budget
        run: ./gradlew --no-daemon --max-workers=3 :budget-cmp:checkBudgets :sample-cmp:assembleRelease :scruter-cmp:assembleRelease :scruter-cmp-compose:assembleRelease
      - name: Budget
        run: cat budget-cmp/build/reports/budget.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmp-screenshots
          path: android/scruter-cmp/build/screenshots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cmp-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7

  # The example app on a real Android: first launch, steps, the settings entry, withdrawal, Android's back, another
  # language, the Compose screen, with Espresso's AccessibilityChecks on every action.
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the example app and its tests
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=3 :sample-cmp:assembleDebug :sample-cmp:assembleDebugAndroidTest -Pscruter.cmpEndpoint=http://127.0.0.1:8787
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: android
          # Two runs: the banner without the TCF, then with the IAB TCF from the first launch (a fresh install each).
          script: |
            ./gradlew --no-daemon --max-workers=3 :sample-cmp:connectedDebugAndroidTest -Pscruter.cmpEndpoint=http://127.0.0.1:8787 -Pandroid.testInstrumentationRunnerArguments.notClass=net.scruter.cmp.sample.TcfFlowTest
            ./gradlew --no-daemon --max-workers=3 :sample-cmp:connectedDebugAndroidTest -Pscruter.cmpEndpoint=http://127.0.0.1:8787 -Pandroid.testInstrumentationRunnerArguments.class=net.scruter.cmp.sample.TcfFlowTest -Pandroid.testInstrumentationRunnerArguments.tcf=true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cmp-device-${{ matrix.api-level }}
          path: android/sample-cmp/build/outputs/androidTest-results/
          retention-days: 7

  # Every Android class name of the catalogue against its SDK's current release (docs/CMP-MOBILE.md §3.14).
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Class names against the SDKs' current releases
        run: python3 scripts/check-sdk-catalogue.py releases catalogue-report.md
      - name: Report
        if: always()
        run: cat catalogue-report.md >> "$GITHUB_STEP_SUMMARY" || true
